name: '🧪 Test Plugin'

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build Plugin
        run: dotnet build -c Release src/Jellyfin.Plugin.Wyzie/Jellyfin.Plugin.Wyzie.csproj

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-net${{ matrix.dotnet-version }}
          path: |
            src/Jellyfin.Plugin.Wyzie/bin/Release/net*/Jellyfin.Plugin.Wyzie.dll
            src/Jellyfin.Plugin.Wyzie/bin/Release/net*/Jellyfin.Plugin.Wyzie.pdb
          retention-days: 14
